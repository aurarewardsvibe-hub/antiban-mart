name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create demo APK file
        run: |
          mkdir -p output
          echo "ANTIBAN MART APK demo build" > output/antiban-mart-demo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiban-mart-apk
          path: output/antiban-mart-demo.apk
